<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ridham Vault Ultra Pro Max+</title>
    
    <!-- Resources -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        /* --- ALL THEMES --- */
        :root {
            --bg: #0f0c29; --accent: #bb86fc; --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1); --text: #ffffff; --font: 'Poppins', sans-serif; --shadow: #774ecb;
            --id-color: #00d2ff;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }
        body.theme-hacker { --bg: #000; --accent: #00ff41; --glass: rgba(0, 255, 65, 0.05); --border: rgba(0, 255, 65, 0.2); --text: #00ff41; --font: 'Share Tech Mono', monospace; --shadow: #008f11; --id-color: #00ff41; }
        body.theme-midnight { --bg: #010b13; --accent: #00d2ff; --glass: rgba(0, 210, 255, 0.05); --border: rgba(0, 210, 255, 0.2); --text: #e0faff; --shadow: #0088aa; --id-color: #fff; }
        body.theme-crimson { --bg: #1a0505; --accent: #ff4d4d; --glass: rgba(255, 77, 77, 0.05); --border: rgba(255, 77, 77, 0.2); --text: #ffcccc; --shadow: #b30000; --id-color: #ffaa00; }
        body.theme-light { --bg: #f0f2f5; --accent: #6200ee; --glass: rgba(255, 255, 255, 0.9); --border: rgba(0, 0, 0, 0.1); --text: #1a1a2e; --shadow: #3700b3; --id-color: #0055ff; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; -webkit-font-smoothing: antialiased; }
        html, body { height: 100%; width: 100%; overflow-x: hidden; }
        body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); transition: background 0.4s var(--ease); }

        #matrix-canvas { position: fixed; top: 0; left: 0; z-index: -1; display: none; pointer-events: none; }
        body.theme-hacker #matrix-canvas { display: block; }

        /* --- LOGO ANIMATION --- */
        @keyframes logoGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px var(--accent)); }
            50% { transform: scale(1.08) translateY(-2px); filter: drop-shadow(0 0 15px var(--accent)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--accent)); }
        }
        .header-logo-full { 
            height: 42px; 
            animation: logoGlow 3s ease-in-out infinite; 
            display: block;
        }

        /* --- CARD ROTATION ANIMATIONS --- */
        .card { 
            background: var(--glass); 
            border-radius: 20px; 
            padding: 15px; 
            border: 1px solid var(--border); 
            text-align: center; 
            cursor: pointer; 
            transition: 0.2s var(--ease); 
            position: relative; 
            overflow: hidden;
            z-index: 1;
        }

        .card::before {
            content: '';
            position: absolute;
            z-index: -2;
            left: -50%;
            top: -50%;
            width: 200%;
            height: 200%;
            display: none;
        }
        .card::after {
            content: '';
            position: absolute;
            z-index: -1;
            inset: 2px;
            background: var(--bg);
            border-radius: 18px;
            display: none;
        }

        body.anim-1 .card::before {
            display: block;
            background: conic-gradient(transparent, transparent, transparent, var(--accent));
            animation: rotateBorder 4s linear infinite;
        }
        body.anim-1 .card::after { display: block; }

        body.anim-2 .card::before {
            display: block;
            background: conic-gradient(var(--accent), transparent 40%, var(--accent));
            animation: rotateBorder 1.5s linear infinite;
        }
        body.anim-2 .card::after { display: block; }

        body.anim-3 .card::before {
            display: block;
            background: conic-gradient(#ff0000, #ff00f7, #001aff, #00ffea, #00ff1a, #ffff00, #ff0000);
            animation: rotateBorder 2s linear infinite;
        }
        body.anim-3 .card::after { display: block; }

        @keyframes rotateBorder {
            100% { transform: rotate(360deg); }
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen { position: fixed; inset: 0; background: #0f0c29; z-index: 50000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s var(--ease); }
        .splash-logo { width: 100px; height: 100px; border-radius: 50%; box-shadow: 0 0 40px var(--accent); animation: splashPop 1.2s var(--ease) forwards; }
        .loader-bar { width: 180px; height: 3px; background: rgba(255,255,255,0.1); margin-top: 30px; border-radius: 10px; overflow: hidden; }
        .loader-fill { width: 0%; height: 100%; background: var(--accent); animation: fillProgress 2s var(--ease) forwards; }
        @keyframes fillProgress { to { width: 100%; } }
        @keyframes splashPop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* --- SIDEBAR --- */
        #sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--bg); border-right: 1px solid var(--border); z-index: 100002; transition: transform 0.4s var(--ease); padding: 30px 20px; display: flex; flex-direction: column; }
        #sidebar.active { transform: translateX(280px); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100001; display: none; opacity: 0; transition: opacity 0.3s var(--ease); }
        .sidebar-header { text-align: center; margin-bottom: 20px; }
        .sidebar-logo { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--accent); margin-bottom: 10px; }
        .menu-item { padding: 12px 15px; margin-bottom: 8px; background: var(--glass); border-radius: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s var(--ease); }
        .menu-item:active { transform: scale(0.96); background: rgba(255,255,255,0.1); }
        .sidebar-stats { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin: 15px 0; border: 1px solid var(--border); }
        .stat-line { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; opacity: 0.7; }
        
        /* Anim Toggles */
        .anim-toggle-group { display: flex; gap: 5px; margin-top: 5px; padding: 0 10px; }
        .anim-btn { flex: 1; padding: 8px; background: var(--glass); border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 10px; cursor: pointer; font-weight: 800; }
        .anim-btn.active { background: var(--accent); color: #000; }

        /* --- HEADER --- */
        .header { padding: 10px 15px; background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .top-row { display: flex; align-items: center; justify-content: space-between; }
        .left-menu-icon { font-size: 22px; color: var(--accent); cursor: pointer; padding: 5px; }

        /* --- DASHBOARD --- */
        .search-bar { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 15px; color: #fff; margin-top: 10px; transition: 0.3s var(--ease); font-size: 14px; }
        .container { padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; }
        .section-title { padding: 15px 15px 5px; font-size: 12px; letter-spacing: 1.5px; font-weight: 800; opacity: 0.6; color: var(--accent); text-transform: uppercase; }

        .card:active { transform: scale(0.94); }
        .card img.acc-icon { width: 50px; height: 50px; border-radius: 12px; margin-bottom: 10px; background: #fff; padding: 2px; position: relative; z-index: 2; }
        .card h4 { margin: 0; font-size: 14px; position: relative; z-index: 2; }
        .folder-count { position: absolute; top: 8px; right: 8px; background: var(--accent); color: #fff; font-size: 9px; padding: 2px 7px; border-radius: 10px; font-weight: 800; z-index: 3; }

        /* --- QR --- */
        .qr-card { padding: 0 !important; border: 2px solid #000; background: #000; border-radius: 20px; overflow: hidden; }
        .qr-full-img { width: 100%; display: block; position: relative; z-index: 2; }
        .qr-label-overlay { background: #000; color: #fff; padding: 8px 5px; font-size: 11px; text-align: center; position: relative; z-index: 2; }
        .qr-copy-tag { position: absolute; top: 10px; left: 10px; background: var(--accent); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; z-index: 3; }

        /* --- FLOATING ACTION BUTTONS --- */
        .fab { position: fixed; bottom: 25px; right: 20px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; box-shadow: 0 5px 15px rgba(187, 134, 252, 0.4); border: none; z-index: 999; }
        .fab-qr { position: fixed; bottom: 100px; right: 20px; width: 60px; height: 60px; background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; z-index: 999; }

        /* --- MODALS --- */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); align-items: center; justify-content: center; z-index: 5000; padding: 20px; opacity: 0; transition: opacity 0.3s var(--ease); }
        .modal.active { display: flex; opacity: 1; }
        .modal-content { background: var(--bg); padding: 25px; border-radius: 30px; width: 100%; max-width: 340px; border: 1px solid var(--border); transform: translateY(30px); transition: transform 0.4s var(--ease); }
        .modal.active .modal-content { transform: translateY(0); }
        .modal-input { width: 100%; padding: 14px; margin: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; color: #fff; }
        .action-btn { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 15px; padding: 14px; font-weight: 800; font-size: 11px; cursor: pointer; }
        
        /* --- FOLDER PAGE --- */
        #folder-full-page { position: fixed; inset: 0; background: var(--bg); z-index: 4000; display: none; flex-direction: column; transform: translateX(100%); transition: transform 0.4s var(--ease); }
        #folder-full-page.active { display: flex; transform: translateX(0); }
        .folder-page-header { padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.1); }
        
        .item-card { background: var(--glass); margin: 8px 15px; padding: 12px 16px; border-radius: 20px; border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .item-mini-icon { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; background: #fff; padding: 2px; }
        .item-info { flex-grow: 1; overflow: hidden; }
        .item-info h5 { margin: 0 0 5px 0; font-size: 13px; color: #fff; }
        .label-text { font-size: 8px; font-weight: 800; opacity: 0.4; text-transform: uppercase; margin-bottom: 2px; display: block; }
        .data-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; background: rgba(255,255,255,0.02); padding: 5px 10px; border-radius: 8px; }
        .id-text { color: var(--id-color); font-size: 12px; font-weight: 500; }
        .pass-text { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
        .copy-btn-small { color: var(--accent); font-size: 16px; padding: 5px; }

        /* --- AUTH SCREEN --- */
        #auth-screen { position: fixed; inset: 0; background: radial-gradient(circle at center, #1e1b4b 0%, #0f0c29 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30000; }
        
        #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 12px 30px; border-radius: 50px; display: none; z-index: 100000; font-size: 12px; font-weight: bold; }
        .gen-result { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; text-align: center; font-family: 'Share Tech Mono', monospace; color: var(--accent); border: 1px dashed var(--accent); margin-bottom: 15px; }
    </style>
</head>
<body class="theme-purple anim-off">

<canvas id="matrix-canvas"></canvas>

<!-- SPLASH SCREEN -->
<div id="splash-screen">
    <img src="https://i.postimg.cc/nzsjqbTR/ic-launcher-round1.png" class="splash-logo">
    <div style="font-weight: 900; letter-spacing: 5px; font-size: 1.2rem; margin-top: 20px; color:#fff;">RIDHAM PRO</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
</div>

<div id="toast">Copied!</div>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="sidebar-header">
        <img src="https://i.postimg.cc/nzsjqbTR/ic-launcher-round1.png" class="sidebar-logo">
        <h3 style="margin:0; letter-spacing:2px; font-weight:900; font-size:18px;">RIDHAM</h3>
        <p id="user-display-email" style="font-size:10px; opacity:0.5;"></p>
    </div>

    <div class="sidebar-stats">
        <div class="stat-line"><span>Folders</span> <span id="stat-folders">0</span></div>
        <div class="stat-line"><span>Accounts</span> <span id="stat-items">0</span></div>
        <div class="stat-line"><span>QRs</span> <span id="stat-qrs">0</span></div>
    </div>

    <div style="font-size: 10px; font-weight: 800; margin: 10px 0 5px 5px; opacity: 0.6; color: var(--accent);">CARD ANIMATIONS</div>
    <div class="anim-toggle-group">
        <button class="anim-btn" id="btn-anim-off" onclick="setAnimation('off')">OFF</button>
        <button class="anim-btn" id="btn-anim-1" onclick="setAnimation('1')">1</button>
        <button class="anim-btn" id="btn-anim-2" onclick="setAnimation('2')">2</button>
        <button class="anim-btn" id="btn-anim-3" onclick="setAnimation('3')">3</button>
    </div>

    <div style="margin-top: 15px;">
        <div class="menu-item" onclick="openThemeModal()"><i class="fa-solid fa-palette"></i><span>Themes</span></div>
        <div class="menu-item" onclick="openGenerator()"><i class="fa-solid fa-key"></i><span>Password Gen</span></div>
        <div class="menu-item" onclick="logout()" style="margin-top:auto; color:#ff4d4d;"><i class="fa-solid fa-power-off"></i><span>Logout</span></div>
    </div>
</div>

<!-- AUTH SCREEN -->
<div id="auth-screen" style="display:none;">
    <img src="https://i.postimg.cc/nzsjqbTR/ic-launcher-round1.png" style="width:100px; border-radius:50%; margin-bottom:20px;">
    <h2 style="letter-spacing:5px; color:#fff; font-size:20px;">RIDHAM</h2>
    <input type="email" id="log-email" class="modal-input" style="max-width:280px" placeholder="Email">
    <input type="password" id="log-pass" class="modal-input" style="max-width:280px" placeholder="Password">
    
    <div style="display:flex; gap:10px; margin-top:15px; width:280px;">
        <button onclick="handleAuth('login')" style="flex:1; padding:15px; border-radius:30px; background:var(--accent); border:none; color:#fff; font-weight:800;">LOGIN</button>
        <button onclick="handleAuth('signup')" style="flex:1; padding:15px; border-radius:30px; background:rgba(255,255,255,0.1); border:1px solid var(--border); color:#fff; font-weight:800;">SIGN UP</button>
    </div>
</div>

<!-- MAIN DASHBOARD -->
<div id="main-content" style="display:none;">
    <div class="header">
        <div class="top-row">
            <i class="fa-solid fa-bars-staggered left-menu-icon" onclick="toggleSidebar()"></i>
            <!-- LOGO WITH ANIMATION -->
            <img src="https://i.postimg.cc/tg1P9ccn/20251226-105223.png" class="header-logo-full">
            <div style="width:32px;"></div>
        </div>
        <input type="text" id="search-bar" class="search-bar" placeholder="Search..." oninput="filterData()">
    </div>

    <div class="section-title">Folders</div>
    <div class="container" id="vault-folders"></div>

    <div class="section-title">QR Vault</div>
    <div class="container" id="vault-qr"></div>
    
    <button class="fab-qr" onclick="toggleModal('modal-qr', true)"><i class="fa-solid fa-qrcode"></i></button>
    <button class="fab" onclick="toggleModal('modal-folder', true)"><i class="fa-solid fa-plus"></i></button>
</div>

<!-- FOLDER PAGE -->
<div id="folder-full-page">
    <div class="folder-page-header">
        <div style="display:flex; align-items:center; gap:15px;">
            <i class="fa-solid fa-arrow-left" style="font-size:20px; cursor:pointer; padding:5px;" onclick="closeFolderPage()"></i>
            <h3 id="folder-title" style="margin:0; letter-spacing:1px; text-transform:uppercase; font-size:15px;">FOLDER</h3>
        </div>
        <i class="fa-solid fa-plus-circle" style="font-size:26px; color:var(--accent); cursor:pointer;" onclick="toggleModal('modal-item', true)"></i>
    </div>
    <div id="folder-items-list" style="overflow-y: auto; flex: 1; padding-bottom: 30px;"></div>
</div>

<!-- MODALS -->
<div class="modal" id="modal-folder" onclick="closeOnOverlay(event)">
    <div class="modal-content">
        <h3 style="text-align:center; margin-top:0;">Folder</h3>
        <input type="text" id="f-name" class="modal-input" placeholder="Name">
        <input type="text" id="f-logo" class="modal-input" placeholder="Logo URL">
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="action-btn" onclick="saveFolder()">SAVE</button>
            <button class="action-btn" style="background:#444;" onclick="toggleModal('modal-folder', false)">BACK</button>
            <button id="f-del-btn" class="action-btn" style="background:#ff4d4d; display:none;" onclick="deleteFolder()">DEL</button>
        </div>
    </div>
</div>

<div class="modal" id="modal-item" onclick="closeOnOverlay(event)">
    <div class="modal-content">
        <h3 style="text-align:center; margin-top:0;">Account</h3>
        <input type="text" id="i-title" class="modal-input" placeholder="Label">
        <input type="text" id="i-user" class="modal-input" placeholder="Email/User">
        <input type="text" id="i-pass" class="modal-input" placeholder="Password">
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="action-btn" onclick="saveItem()">SAVE</button>
            <button class="action-btn" style="background:#444;" onclick="toggleModal('modal-item', false)">BACK</button>
            <button id="i-del-btn" class="action-btn" style="background:#ff4d4d; display:none;" onclick="deleteItem()">DEL</button>
        </div>
    </div>
</div>

<div class="modal" id="modal-qr" onclick="closeOnOverlay(event)">
    <div class="modal-content">
        <h3 style="text-align:center; margin-top:0;">QR Code</h3>
        <input type="text" id="qr-name" class="modal-input" placeholder="Name">
        <input type="text" id="qr-url" class="modal-input" placeholder="Image URL">
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="action-btn" onclick="saveQr()">SAVE</button>
            <button class="action-btn" style="background:#444;" onclick="toggleModal('modal-qr', false)">BACK</button>
            <button id="qr-del-btn" class="action-btn" style="background:#ff4d4d; display:none;" onclick="deleteQr()">DEL</button>
        </div>
    </div>
</div>

<div class="modal" id="modal-generator">
    <div class="modal-content">
        <h3 style="text-align:center; margin-top:0;">Security Gen</h3>
        <div class="gen-result" id="gen-output">********</div>
        <button class="action-btn" style="width:100%; margin-bottom:10px;" onclick="generatePass()">GENERATE</button>
        <button class="action-btn" style="width:100%; background:#444;" onclick="toggleModal('modal-generator', false)">CLOSE</button>
    </div>
</div>

<div class="modal" id="theme-modal">
    <div class="modal-content">
        <h3 style="text-align:center; margin-top:0;">Themes</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div onclick="setTheme('theme-purple')" class="menu-item" style="justify-content:center; font-size:10px;">PURPLE</div>
            <div onclick="setTheme('theme-hacker')" class="menu-item" style="justify-content:center; font-size:10px; color:#00ff41;">HACKER</div>
            <div onclick="setTheme('theme-midnight')" class="menu-item" style="justify-content:center; font-size:10px; color:#00d2ff;">MIDNIGHT</div>
            <div onclick="setTheme('theme-crimson')" class="menu-item" style="justify-content:center; font-size:10px; color:#ff4d4d;">CRIMSON</div>
            <div onclick="setTheme('theme-light')" class="menu-item" style="justify-content:center; font-size:10px; color:#000; background:#fff;">LIGHT</div>
        </div>
        <button class="action-btn" style="width:100%; margin-top:15px; background:#444;" onclick="toggleModal('theme-modal', false)">CLOSE</button>
    </div>
</div>

<script>
    // System Init
    window.onload = () => { 
        setTimeout(() => { 
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => splash.style.display = 'none', 600);
        }, 2200); 
        initMatrix(); 
        
        // Load Saved Animation Style
        const savedAnim = localStorage.getItem('ridham_anim') || 'off';
        setAnimation(savedAnim);
    };
    
    const firebaseConfig = { apiKey: "AIzaSyCIj9gLNxEqbJN5vBEHWkbpYJOYjiE_SCs", authDomain: "ultra-vault.firebaseapp.com", projectId: "ultra-vault", storageBucket: "ultra-vault.appspot.com", messagingSenderId: "292858589106", appId: "1:292858589106:web:caa4acb57e46907fbd3eab" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.firestore();
    
    let currentUser = null, allData = [], selectedId = null, activeFolder = null;

    auth.onAuthStateChanged(user => {
        if (user) { 
            currentUser = user; 
            document.getElementById('user-display-email').innerText = user.email;
            document.getElementById('auth-screen').style.display = 'none'; 
            document.getElementById('main-content').style.display = 'block'; 
            syncData(); 
        } else { 
            document.getElementById('auth-screen').style.display = 'flex'; 
            document.getElementById('main-content').style.display = 'none'; 
        }
    });

    function syncData() {
        db.collection("vault").where("userId", "==", currentUser.uid).onSnapshot(snap => {
            allData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            filterData();
            updateStats();
        });
    }

    function updateStats() {
        document.getElementById('stat-folders').innerText = allData.filter(d => d.type === 'folder').length;
        document.getElementById('stat-items').innerText = allData.filter(d => d.type === 'item').length;
        document.getElementById('stat-qrs').innerText = allData.filter(d => d.type === 'qr').length;
    }

    function filterData() {
        const q = document.getElementById('search-bar').value.toLowerCase();
        const fCont = document.getElementById('vault-folders');
        const qCont = document.getElementById('vault-qr');
        const iCont = document.getElementById('folder-items-list');
        
        fCont.innerHTML = ''; qCont.innerHTML = ''; iCont.innerHTML = '';
        
        const folders = allData.filter(d => d.type === 'folder' && d.name.toLowerCase().includes(q));
        const qrs = allData.filter(d => d.type === 'qr' && d.name.toLowerCase().includes(q));
        const items = allData.filter(d => d.type === 'item');

        folders.forEach(f => {
            const count = items.filter(i => i.parentId === f.id).length;
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => openFolderPage(f);
            const icon = f.logo || `https://ui-avatars.com/api/?name=${f.name}&background=random&color=fff`;
            div.innerHTML = `<div class="folder-count">${count}</div><img class="acc-icon" src="${icon}"><h4>${f.name}</h4>
            <i class="fa-solid fa-ellipsis-vertical" style="position:absolute; bottom:12px; right:12px; opacity:0.3; z-index:4;" onclick="event.stopPropagation(); openEditFolder('${f.id}')"></i>`;
            fCont.appendChild(div);
        });

        qrs.forEach(qr => {
            const div = document.createElement('div');
            div.className = 'card qr-card';
            div.onclick = () => openEditQr(qr.id);
            div.innerHTML = `<div class="qr-copy-tag" onclick="copyIt(event,'${qr.qrUrl}')"><i class="fa-solid fa-copy"></i></div>
            <img class="qr-full-img" src="${qr.qrUrl}"><div class="qr-label-overlay">${qr.name}</div>`;
            qCont.appendChild(div);
        });

        if(activeFolder) {
            items.filter(i => i.parentId === activeFolder.id && (i.title.toLowerCase().includes(q) || i.user.toLowerCase().includes(q))).forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-card';
                const fIcon = activeFolder.logo || `https://ui-avatars.com/api/?name=${activeFolder.name}&background=random`;
                div.innerHTML = `
                    <img src="${fIcon}" class="item-mini-icon">
                    <div class="item-info">
                        <h5>${item.title || 'Account'}</h5>
                        <span class="label-text">User</span>
                        <div class="data-row"><span class="id-text">${item.user}</span><i class="fa-solid fa-copy copy-btn-small" onclick="copyIt(event,'${item.user}')"></i></div>
                        <span class="label-text">Password</span>
                        <div class="data-row"><span class="pass-text">${item.pass}</span><i class="fa-solid fa-copy copy-btn-small" onclick="copyIt(event,'${item.pass}')"></i></div>
                    </div>
                    <i class="fa-solid fa-pen-to-square" style="color:var(--accent); font-size:18px; padding:10px;" onclick="openEditItem('${item.id}')"></i>`;
                iCont.appendChild(div);
            });
        }
    }

    // Animation Control
    function setAnimation(type) {
        document.body.classList.remove('anim-off', 'anim-1', 'anim-2', 'anim-3');
        document.body.classList.add('anim-' + type);
        document.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-anim-' + type).classList.add('active');
        localStorage.setItem('ridham_anim', type);
    }

    // Navigation
    function openFolderPage(folder) {
        activeFolder = folder;
        document.getElementById('folder-title').innerText = folder.name;
        const page = document.getElementById('folder-full-page');
        page.style.display = 'flex';
        setTimeout(() => page.classList.add('active'), 10);
        filterData();
    }
    function closeFolderPage() {
        const page = document.getElementById('folder-full-page');
        page.classList.remove('active');
        setTimeout(() => { page.style.display = 'none'; activeFolder = null; filterData(); }, 400);
    }

    // Modals
    function toggleModal(id, show) {
        const m = document.getElementById(id);
        if(show) { m.style.display = 'flex'; setTimeout(() => m.classList.add('active'), 10); }
        else { m.classList.remove('active'); setTimeout(() => { m.style.display = 'none'; selectedId = null; resetInputs(id); }, 300); }
    }
    function closeOnOverlay(e) { if(e.target.classList.contains('modal')) toggleModal(e.target.id, false); }
    function resetInputs(id) { 
        document.querySelectorAll(`#${id} input`).forEach(i => i.value = ''); 
        const del = document.querySelector(`#${id} [id$="-del-btn"]`);
        if(del) del.style.display = 'none';
    }

    // Firebase
    async function handleAuth(type) {
        const e = document.getElementById('log-email').value, p = document.getElementById('log-pass').value;
        if(!e || !p) return;
        try { if(type === 'login') await auth.signInWithEmailAndPassword(e, p); else await auth.createUserWithEmailAndPassword(e, p); } catch (err) { alert(err.message); }
    }

    async function saveFolder() {
        const n = document.getElementById('f-name').value, l = document.getElementById('f-logo').value;
        if(!n) return;
        const d = { type:'folder', name:n, logo:l, userId:currentUser.uid };
        if(selectedId) await db.collection("vault").doc(selectedId).update(d); else await db.collection("vault").add(d);
        toggleModal('modal-folder', false);
    }

    async function saveItem() {
        const t = document.getElementById('i-title').value, u = document.getElementById('i-user').value, p = document.getElementById('i-pass').value;
        if(!u || !p) return;
        const d = { type:'item', title:t, user:u, pass:p, parentId:activeFolder.id, userId:currentUser.uid };
        if(selectedId) await db.collection("vault").doc(selectedId).update(d); else await db.collection("vault").add(d);
        toggleModal('modal-item', false);
    }

    async function saveQr() {
        const n = document.getElementById('qr-name').value, u = document.getElementById('qr-url').value;
        if(!n || !u) return;
        const d = { type:'qr', name:n, qrUrl:u, userId:currentUser.uid };
        if(selectedId) await db.collection("vault").doc(selectedId).update(d); else await db.collection("vault").add(d);
        toggleModal('modal-qr', false);
    }

    function openEditFolder(id) { selectedId = id; const d = allData.find(x=>x.id===id); document.getElementById('f-name').value=d.name; document.getElementById('f-logo').value=d.logo||''; document.getElementById('f-del-btn').style.display='block'; toggleModal('modal-folder', true); }
    function openEditItem(id) { selectedId = id; const d = allData.find(x=>x.id===id); document.getElementById('i-title').value=d.title; document.getElementById('i-user').value=d.user; document.getElementById('i-pass').value=d.pass; document.getElementById('i-del-btn').style.display='block'; toggleModal('modal-item', true); }
    function openEditQr(id) { selectedId = id; const d = allData.find(x=>x.id===id); document.getElementById('qr-name').value=d.name; document.getElementById('qr-url').value=d.qrUrl; document.getElementById('qr-del-btn').style.display='block'; toggleModal('modal-qr', true); }

    async function deleteFolder() { if(confirm("Delete Folder?")) { const batch = db.batch(); allData.filter(i=>i.parentId===selectedId).forEach(i=>batch.delete(db.collection("vault").doc(i.id))); batch.delete(db.collection("vault").doc(selectedId)); await batch.commit(); toggleModal('modal-folder', false); } }
    async function deleteItem() { if(confirm("Delete?")) { await db.collection("vault").doc(selectedId).delete(); toggleModal('modal-item', false); } }
    async function deleteQr() { if(confirm("Delete?")) { await db.collection("vault").doc(selectedId).delete(); toggleModal('modal-qr', false); } }

    function copyIt(ev, txt) {
        ev.stopPropagation();
        const icon = ev.currentTarget;
        const originalClass = icon.className;
        navigator.clipboard.writeText(txt).then(() => {
            icon.className = "fa-solid fa-check";
            document.getElementById('toast').style.display = 'block';
            setTimeout(() => { icon.className = originalClass; document.getElementById('toast').style.display = 'none'; }, 1500);
        });
    }

    function generatePass() {
        const c = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
        let p = ""; for(let i=0; i<14; i++) p += c.charAt(Math.floor(Math.random()*c.length));
        document.getElementById('gen-output').innerText = p;
    }

    function setTheme(t) { document.body.className = t + ' ' + (localStorage.getItem('ridham_anim') ? 'anim-'+localStorage.getItem('ridham_anim') : 'anim-off'); localStorage.setItem('ridham_theme', t); toggleModal('theme-modal', false); }
    const savedTheme = localStorage.getItem('ridham_theme') || 'theme-purple';
    document.body.classList.add(savedTheme);

    function toggleSidebar() { 
        const s = document.getElementById('sidebar'), o = document.querySelector('.sidebar-overlay');
        if(s.classList.contains('active')) { s.classList.remove('active'); o.style.opacity='0'; setTimeout(()=>o.style.display='none',300); }
        else { o.style.display='block'; setTimeout(()=>o.style.opacity='1',10); s.classList.add('active'); }
    }
    function openThemeModal() { toggleSidebar(); toggleModal('theme-modal', true); }
    function openGenerator() { toggleSidebar(); toggleModal('modal-generator', true); generatePass(); }
    function logout() { auth.signOut(); }

    function initMatrix() {
        const c = document.getElementById('matrix-canvas'), ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const l = "01", f = 10, cols = c.width/f, drops = Array(Math.floor(cols)).fill(1);
        function draw() {
            if(!document.body.classList.contains('theme-hacker')) return;
            ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle = "#00ff41"; ctx.font = f+"px monospace";
            drops.forEach((y,i) => { ctx.fillText(l[Math.floor(Math.random()*l.length)], i*f, y*f); if(y*f > c.height && Math.random() > 0.975) drops[i]=0; drops[i]++; });
        } setInterval(draw, 35);
    }
</script>
</body>
</html>
