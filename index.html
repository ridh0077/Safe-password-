<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ridham Vault Ultra Pro Max+</title>
    
    <!-- Resources -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        /* --- ALL THEMES --- */
        :root {
            --bg: #0f0c29; --accent: #bb86fc; --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1); --text: #ffffff; --font: 'Poppins', sans-serif; --shadow: #774ecb;
            --id-color: #00d2ff;
        }
        body.theme-hacker { --bg: #000; --accent: #00ff41; --glass: rgba(0, 255, 65, 0.05); --border: rgba(0, 255, 65, 0.2); --text: #00ff41; --font: 'Share Tech Mono', monospace; --shadow: #008f11; --id-color: #00ff41; }
        body.theme-midnight { --bg: #010b13; --accent: #00d2ff; --glass: rgba(0, 210, 255, 0.05); --border: rgba(0, 210, 255, 0.2); --text: #e0faff; --shadow: #0088aa; --id-color: #fff; }
        body.theme-crimson { --bg: #1a0505; --accent: #ff4d4d; --glass: rgba(255, 77, 77, 0.05); --border: rgba(255, 77, 77, 0.2); --text: #ffcccc; --shadow: #b30000; --id-color: #ffaa00; }
        body.theme-light { --bg: #f0f2f5; --accent: #6200ee; --glass: rgba(255, 255, 255, 0.9); --border: rgba(0, 0, 0, 0.1); --text: #1a1a2e; --shadow: #3700b3; --id-color: #0055ff; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); transition: background 0.5s ease; min-height: 100vh; overflow-x: hidden; }

        #matrix-canvas { position: fixed; top: 0; left: 0; z-index: -1; display: none; }
        body.theme-hacker #matrix-canvas { display: block; }

        @keyframes floatLogo { from { transform: translateY(0); } to { transform: translateY(-8px); } }
        @keyframes pulseAccent { 0% { box-shadow: 0 0 0 0 rgba(187, 134, 252, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(187, 134, 252, 0); } 100% { box-shadow: 0 0 0 0 rgba(187, 134, 252, 0); } }

        /* SPLASH SCREEN */
        #splash-screen { position: fixed; inset: 0; background: #0f0c29; z-index: 50000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .splash-logo { width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 0 50px var(--accent); animation: splashPop 1.5s ease-out forwards; }
        .loader-bar { width: 200px; height: 4px; background: rgba(255,255,255,0.1); margin-top: 40px; border-radius: 10px; overflow: hidden; }
        .loader-fill { width: 0%; height: 100%; background: var(--accent); animation: fillProgress 2.5s ease-in-out forwards; }
        @keyframes fillProgress { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes splashPop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* SIDEBAR */
        #sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--bg); border-right: 1px solid var(--border); z-index: 100002; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 30px 20px; display: flex; flex-direction: column; }
        #sidebar.active { left: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100001; display: none; backdrop-filter: blur(4px); }
        .sidebar-header { text-align: center; margin-bottom: 25px; }
        .sidebar-logo { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--accent); margin-bottom: 10px; }
        .menu-item { padding: 14px; margin-bottom: 8px; background: var(--glass); border-radius: 12px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s; border: 1px solid transparent; }
        .menu-item:hover { background: rgba(255,255,255,0.1); border-color: var(--border); transform: translateX(5px); }
        
        /* SIDEBAR STATS */
        .sidebar-stats { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin: 20px 0; border: 1px solid var(--border); }
        .stat-line { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; opacity: 0.8; }
        .stat-line span:last-child { color: var(--accent); font-weight: 800; }

        /* HEADER */
        .header { padding: 10px 15px; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .top-row { display: flex; align-items: center; justify-content: space-between; }
        .header-logo-full { height: 45px; animation: floatLogo 2s infinite alternate; }
        .left-menu-icon { font-size: 22px; color: var(--accent); cursor: pointer; }

        /* DASHBOARD GRID */
        .search-bar { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 15px; color: #fff; margin-top: 10px; transition: 0.3s; }
        .search-bar:focus { background: rgba(255,255,255,0.08); border-color: var(--accent); }
        .container { padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        
        .section-title { padding: 20px 15px 5px; font-size: 13px; letter-spacing: 2px; font-weight: 800; opacity: 0.8; color: var(--accent); text-transform: uppercase; }

        /* FOLDER CARD */
        .card { background: var(--glass); border-radius: 20px; padding: 15px; border: 1px solid var(--border); text-align: center; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); background: rgba(255,255,255,0.08); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .card img.acc-icon { width: 55px; height: 55px; border-radius: 15px; margin-bottom: 12px; object-fit: cover; background: #fff; padding: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .folder-count { position: absolute; top: 8px; right: 8px; background: var(--accent); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: 800; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        /* QR CARD */
        .qr-card { padding: 0 !important; border: 3px solid #000; background: #000; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: 0.3s; }
        .qr-card:hover { transform: scale(1.03); }
        .qr-full-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
        .qr-label-overlay { background: #000; color: #fff; padding: 12px 5px; font-size: 12px; font-weight: 600; text-align: center; width: 100%; }
        .qr-copy-tag { position: absolute; top: 10px; left: 10px; background: var(--accent); color: #fff; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; z-index: 10; border: 2px solid rgba(255,255,255,0.2); }

        /* FLOATING BUTTONS */
        .fab { position: fixed; bottom: 30px; right: 25px; width: 65px; height: 65px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; box-shadow: 0 5px 15px var(--accent); border: none; z-index: 999; animation: pulseAccent 2s infinite; }
        .fab-qr { position: fixed; bottom: 110px; right: 25px; width: 65px; height: 65px; background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4); border: none; z-index: 999; }

        /* MODALS */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .modal-content { background: var(--bg); padding: 30px; border-radius: 30px; width: 100%; max-width: 340px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal-input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; color: #fff; transition: 0.3s; }
        .modal-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }
        .action-btn { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 15px; padding: 14px; font-weight: 800; font-size: 11px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px var(--shadow); }
        .action-btn:active { transform: translateY(2px); box-shadow: none; }
        
        /* FOLDER PAGE */
        #folder-full-page { position: fixed; inset: 0; background: var(--bg); z-index: 4000; display: none; flex-direction: column; transition: 0.4s; }
        .folder-page-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(15px); }
        
        /* ITEM CARDS */
        .item-card { background: var(--glass); margin: 12px 15px; padding: 20px; border-radius: 25px; border: 1px solid var(--border); display: flex; align-items: flex-start; gap: 15px; position: relative; transition: 0.3s; }
        .item-card:hover { border-color: var(--accent); background: rgba(255,255,255,0.06); }
        .item-card img.item-mini-icon { width: 45px; height: 45px; border-radius: 12px; object-fit: cover; background: #fff; padding: 3px; flex-shrink: 0; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .item-info { flex-grow: 1; overflow: hidden; }
        .item-info h5 { margin: 0 0 14px 0; font-size: 15px; color: #fff; font-weight: 600; }
        
        .label-text { font-size: 9px; font-weight: 800; opacity: 0.5; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 4px; display: block; }
        
        .data-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; background: rgba(255,255,255,0.03); padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .data-row:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
        .id-text { color: var(--id-color); font-size: 13.5px; font-weight: 600; word-break: break-all; }
        .pass-text { color: var(--accent); font-size: 15px; font-weight: 800; letter-spacing: 1.5px; }
        
        .copy-btn-small { color: var(--accent); font-size: 18px; cursor: pointer; padding: 5px; transition: 0.2s; }
        .copy-btn-small:active { transform: scale(1.3); color: #fff; }

        .edit-icon-abs { position: absolute; top: 20px; right: 20px; opacity: 0.2; font-size: 20px; cursor: pointer; transition: 0.3s; }
        .edit-icon-abs:hover { opacity: 0.8; color: var(--accent); }

        #auth-screen { position: fixed; inset: 0; background: radial-gradient(circle at center, #1e1b4b 0%, #0f0c29 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30000; }
        #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 12px 35px; border-radius: 50px; display: none; z-index: 100000; font-size: 13px; font-weight: bold; pointer-events: none; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        
        /* GENERATOR STYLING */
        .gen-result { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 18px; color: var(--accent); border: 1px dashed var(--accent); margin-bottom: 15px; word-break: break-all; }
    </style>
</head>
<body class="theme-purple">

<canvas id="matrix-canvas"></canvas>

<!-- SPLASH SCREEN -->
<div id="splash-screen">
    <img src="https://i.postimg.cc/nzsjqbTR/ic-launcher-round1.png" class="splash-logo">
    <div style="font-weight: 900; letter-spacing: 5px; font-size: 1.5rem; margin-top: 20px; color:#fff;">RIDHAM PRO</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
</div>

<div id="toast">Copied Successfully!</div>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="sidebar-header">
        <img src="https://i.postimg.cc/nzsjqbTR/ic-launcher-round1.png" class="sidebar-logo">
        <h3 style="margin:0; letter-spacing:3px; font-weight:900;">RIDHAM</h3>
        <p id="user-display-email" style="font-size:10px; opacity:0.6;"></p>
    </div>

    <div class="sidebar-stats">
        <div class="stat-line"><span>Total Folders</span> <span id="stat-folders">0</span></div>
        <div class="stat-line"><span>Total Accounts</span> <span id="stat-items">0</span></div>
        <div class="stat-line"><span>Total QR Codes</span> <span id="stat-qrs">0</span></div>
    </div>

    <div class="menu-item" onclick="openThemeModal()"><i class="fa-solid fa-palette"></i><span>Themes</span></div>
    <div class="menu-item" onclick="openGenerator()"><i class="fa-solid fa-key"></i><span>Password Gen</span></div>
    <div class="menu-item" onclick="logout()" style="margin-top:auto; color:#ff4d4d;"><i class="fa-solid fa-power-off"></i><span>Logout</span></div>
</div>

<!-- AUTH SCREEN -->
<div id="auth-screen" style="display:none;">
    <img src="https://i.postimg.cc/nzsjqbTR/ic-launcher-round1.png" style="width:120px; border-radius:50%; margin-bottom:20px;">
    <h2 style="letter-spacing:5px; color:#fff;">RIDHAM</h2>
    <input type="email" id="log-email" class="modal-input" style="max-width:300px" placeholder="Email">
    <input type="password" id="log-pass" class="modal-input" style="max-width:300px" placeholder="Password">
    <button onclick="handleAuth()" style="width:200px; padding:15px; border-radius:30px; background:var(--accent); border:none; color:#fff; font-weight:800; margin-top:20px;">LOGIN</button>
</div>

<!-- MAIN DASHBOARD -->
<div id="main-content" style="display:none;">
    <div class="header">
        <div class="top-row">
            <i class="fa-solid fa-bars-staggered left-menu-icon" onclick="toggleSidebar()"></i>
            <img src="https://i.postimg.cc/tg1P9ccn/20251226-105223.png" class="header-logo-full">
            <div style="width:22px;"></div>
        </div>
        <input type="text" id="search-bar" class="search-bar" placeholder="Search across all..." oninput="filterData()">
    </div>

    <div class="section-title"><i class="fa-solid fa-folder-open"></i> Folders</div>
    <div class="container" id="vault-folders"></div>

    <div class="section-title"><i class="fa-solid fa-qrcode"></i> QR Vault</div>
    <div class="container" id="vault-qr"></div>
    
    <button class="fab-qr" onclick="openQrModal()"><i class="fa-solid fa-qrcode"></i></button>
    <button class="fab" onclick="openFolderModal()"><i class="fa-solid fa-plus"></i></button>
</div>

<!-- FOLDER PAGE -->
<div id="folder-full-page">
    <div class="folder-page-header">
        <div style="display:flex; align-items:center; gap:15px;">
            <i class="fa-solid fa-arrow-left" style="font-size:22px; cursor:pointer;" onclick="closeFolderPage()"></i>
            <h3 id="folder-title" style="margin:0; letter-spacing:2px; text-transform:uppercase; font-size:16px;">FOLDER</h3>
        </div>
        <i class="fa-solid fa-plus-circle" style="font-size:28px; color:var(--accent); cursor:pointer;" onclick="openItemModal()"></i>
    </div>
    <div id="folder-items-list"></div>
</div>

<!-- MODAL: ADD FOLDER -->
<div class="modal" id="modal-folder">
    <div class="modal-content">
        <h3 style="text-align:center;">CREATE FOLDER</h3>
        <input type="text" id="f-name" class="modal-input" placeholder="Folder Name (e.g. Social Media)">
        <input type="text" id="f-logo" class="modal-input" placeholder="Logo URL (Optional)">
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="action-btn" onclick="saveFolder()">CREATE</button>
            <button class="action-btn" style="background:#444;" onclick="closeAllModals()">BACK</button>
            <button id="f-del-btn" class="action-btn" style="background:#ff4d4d; display:none;" onclick="deleteFolder()">DELETE</button>
        </div>
    </div>
</div>

<!-- MODAL: ADD ITEM -->
<div class="modal" id="modal-item">
    <div class="modal-content">
        <h3 style="text-align:center;">ADD ACCOUNT</h3>
        <input type="text" id="i-title" class="modal-input" placeholder="Account Label (e.g. Personal)">
        <input type="text" id="i-user" class="modal-input" placeholder="User / Email">
        <input type="text" id="i-pass" class="modal-input" placeholder="Password">
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="action-btn" onclick="saveItem()">SAVE</button>
            <button class="action-btn" style="background:#444;" onclick="closeAllModals()">BACK</button>
            <button id="i-del-btn" class="action-btn" style="background:#ff4d4d; display:none;" onclick="deleteItem()">DELETE</button>
        </div>
    </div>
</div>

<!-- MODAL: QR -->
<div class="modal" id="modal-qr">
    <div class="modal-content">
        <h3 style="text-align:center;">QR CODE</h3>
        <input type="text" id="qr-name" class="modal-input" placeholder="Label">
        <input type="text" id="qr-url" class="modal-input" placeholder="Image URL">
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="action-btn" style="background:#00d2ff;" onclick="saveQr()">SAVE QR</button>
            <button class="action-btn" style="background:#444;" onclick="closeAllModals()">BACK</button>
            <button id="qr-del-btn" class="action-btn" style="background:#ff4d4d; display:none;" onclick="deleteQr()">DELETE</button>
        </div>
    </div>
</div>

<!-- MODAL: PASSWORD GENERATOR -->
<div class="modal" id="modal-generator">
    <div class="modal-content">
        <h3 style="text-align:center;">PASSWORD GEN</h3>
        <div class="gen-result" id="gen-output">P@ssw0rd123</div>
        <button class="action-btn" style="width:100%; margin-bottom:10px;" onclick="generatePass()">GENERATE NEW</button>
        <button class="action-btn" style="width:100%; background:#444;" onclick="closeAllModals()">CLOSE</button>
    </div>
</div>

<!-- MODAL: THEMES -->
<div class="modal" id="theme-modal">
    <div class="modal-content">
        <h3 style="text-align:center;">THEMES</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;">
            <div onclick="setTheme('theme-purple')" style="background:#0f0c29; padding:12px; border-radius:12px; border:1px solid #bb86fc; text-align:center; cursor:pointer; font-size:10px;">PURPLE</div>
            <div onclick="setTheme('theme-hacker')" style="background:#000; color:#00ff41; padding:12px; border-radius:12px; border:1px solid #00ff41; text-align:center; cursor:pointer; font-size:10px;">HACKER</div>
            <div onclick="setTheme('theme-midnight')" style="background:#010b13; padding:12px; border-radius:12px; border:1px solid #00d2ff; text-align:center; cursor:pointer; font-size:10px;">MIDNIGHT</div>
            <div onclick="setTheme('theme-crimson')" style="background:#1a0505; color:#ff4d4d; padding:12px; border-radius:12px; border:1px solid #ff4d4d; text-align:center; cursor:pointer; font-size:10px;">CRIMSON</div>
            <div onclick="setTheme('theme-light')" style="background:#fff; color:#000; padding:12px; border-radius:12px; border:1px solid #6200ee; text-align:center; cursor:pointer; font-size:10px;">LIGHT</div>
        </div>
        <button class="action-btn" style="width:100%; margin-top:20px; background:#444;" onclick="document.getElementById('theme-modal').style.display='none'">CLOSE</button>
    </div>
</div>

<script>
    window.onload = () => { setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; }, 2600); initMatrix(); };
    
    const firebaseConfig = { apiKey: "AIzaSyCIj9gLNxEqbJN5vBEHWkbpYJOYjiE_SCs", authDomain: "ultra-vault.firebaseapp.com", projectId: "ultra-vault", storageBucket: "ultra-vault.appspot.com", messagingSenderId: "292858589106", appId: "1:292858589106:web:caa4acb57e46907fbd3eab" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.firestore();
    
    let currentUser = null, allData = [], selectedDocId = null, activeFolder = null;

    auth.onAuthStateChanged(user => {
        if (user) { 
            currentUser = user; 
            document.getElementById('user-display-email').innerText = user.email;
            document.getElementById('auth-screen').style.display = 'none'; 
            document.getElementById('main-content').style.display = 'block'; 
            syncData(); 
        } else { 
            document.getElementById('auth-screen').style.display = 'flex'; 
            document.getElementById('main-content').style.display = 'none'; 
        }
    });

    function syncData() {
        db.collection("vault").where("userId", "==", currentUser.uid).onSnapshot(snap => {
            allData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            filterData();
            updateStats();
        });
    }

    function updateStats() {
        const folders = allData.filter(d => d.type === 'folder').length;
        const items = allData.filter(d => d.type === 'item').length;
        const qrs = allData.filter(d => d.type === 'qr').length;
        document.getElementById('stat-folders').innerText = folders;
        document.getElementById('stat-items').innerText = items;
        document.getElementById('stat-qrs').innerText = qrs;
    }

    function filterData() {
        const q = document.getElementById('search-bar').value.toLowerCase();
        const folderCont = document.getElementById('vault-folders');
        const qrCont = document.getElementById('vault-qr');
        const itemListCont = document.getElementById('folder-items-list');
        
        folderCont.innerHTML = ''; qrCont.innerHTML = ''; itemListCont.innerHTML = '';
        
        const folders = allData.filter(d => d.type === 'folder' && d.name.toLowerCase().includes(q));
        const qrs = allData.filter(d => d.type === 'qr' && d.name.toLowerCase().includes(q));
        const items = allData.filter(d => d.type === 'item');

        folders.forEach(f => {
            const itemCount = items.filter(i => i.parentId === f.id).length;
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => openFolderPage(f);
            const defaultIcon = `https://ui-avatars.com/api/?name=${f.name}&background=random&color=fff&bold=true`;
            div.innerHTML = `
                <div class="folder-count">${itemCount}</div>
                <img class="acc-icon" src="${f.logo || defaultIcon}">
                <h4 style="margin:0; font-size:14px;">${f.name}</h4>
                <i class="fa-solid fa-gear" style="position:absolute; bottom:10px; right:10px; opacity:0.3; font-size:12px;" onclick="event.stopPropagation(); openFolderModal('${f.id}', ${JSON.stringify(f).replace(/"/g, '&quot;')})"></i>
            `;
            folderCont.appendChild(div);
        });

        qrs.forEach(qr => {
            const div = document.createElement('div');
            div.className = 'card qr-card';
            div.onclick = () => openQrModal(qr.id, qr);
            div.innerHTML = `
                <div class="qr-copy-tag" onclick="copyIt(event,'${qr.qrUrl}')"><i class="fa-solid fa-copy"></i></div>
                <img class="qr-full-img" src="${qr.qrUrl}">
                <div class="qr-label-overlay">${qr.name}</div>
            `;
            qrCont.appendChild(div);
        });

        if(activeFolder) {
            const filteredItems = items.filter(i => i.parentId === activeFolder.id && (i.title.toLowerCase().includes(q) || i.user.toLowerCase().includes(q)));
            filteredItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-card';
                const folderLogo = activeFolder.logo || `https://ui-avatars.com/api/?name=${activeFolder.name}&background=random`;
                div.innerHTML = `
                    <img src="${folderLogo}" class="item-mini-icon">
                    <div class="item-info">
                        <h5>${item.title || 'No Title'}</h5>
                        <span class="label-text">USER / EMAIL</span>
                        <div class="data-row">
                            <span class="id-text">${item.user}</span>
                            <i class="fa-solid fa-copy copy-btn-small" onclick="copyIt(event,'${item.user}')"></i>
                        </div>
                        <span class="label-text">PASSWORD</span>
                        <div class="data-row">
                            <span class="pass-text">${item.pass}</span>
                            <i class="fa-solid fa-copy copy-btn-small" onclick="copyIt(event,'${item.pass}')"></i>
                        </div>
                    </div>
                    <i class="fa-solid fa-pen-to-square edit-icon-abs" onclick="openItemModal('${item.id}', ${JSON.stringify(item).replace(/"/g, '&quot;')})"></i>
                `;
                itemListCont.appendChild(div);
            });
        }
    }

    // FOLDER LOGIC
    function openFolderPage(folder) {
        activeFolder = folder;
        document.getElementById('folder-title').innerText = folder.name;
        document.getElementById('folder-full-page').style.display = 'flex';
        document.getElementById('search-bar').placeholder = `Search in ${folder.name}...`;
        filterData();
    }
    function closeFolderPage() {
        activeFolder = null;
        document.getElementById('folder-full-page').style.display = 'none';
        document.getElementById('search-bar').placeholder = "Search across all...";
        filterData();
    }

    // MODAL OPENERS
    function openFolderModal(id = null, data = null) {
        selectedDocId = id;
        document.getElementById('modal-folder').style.display = 'flex';
        if(id) {
            document.getElementById('f-name').value = data.name;
            document.getElementById('f-logo').value = data.logo || '';
            document.getElementById('f-del-btn').style.display = 'block';
        } else {
            document.getElementById('f-name').value = '';
            document.getElementById('f-logo').value = '';
            document.getElementById('f-del-btn').style.display = 'none';
        }
    }

    function openItemModal(id = null, data = null) {
        selectedDocId = id;
        document.getElementById('modal-item').style.display = 'flex';
        if(id) {
            document.getElementById('i-title').value = data.title || '';
            document.getElementById('i-user').value = data.user;
            document.getElementById('i-pass').value = data.pass;
            document.getElementById('i-del-btn').style.display = 'block';
        } else {
            document.getElementById('i-title').value = '';
            document.getElementById('i-user').value = '';
            document.getElementById('i-pass').value = '';
            document.getElementById('i-del-btn').style.display = 'none';
        }
    }

    function openQrModal(id = null, data = null) {
        selectedDocId = id;
        document.getElementById('modal-qr').style.display = 'flex';
        if(id) {
            document.getElementById('qr-name').value = data.name;
            document.getElementById('qr-url').value = data.qrUrl;
            document.getElementById('qr-del-btn').style.display = 'block';
        } else {
            document.getElementById('qr-name').value = '';
            document.getElementById('qr-url').value = '';
            document.getElementById('qr-del-btn').style.display = 'none';
        }
    }

    function openGenerator() { toggleSidebar(); document.getElementById('modal-generator').style.display = 'flex'; generatePass(); }
    function closeAllModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); selectedDocId = null; }

    // DATABASE OPERATIONS
    async function saveFolder() {
        const name = document.getElementById('f-name').value;
        if(!name) return;
        const d = { type: 'folder', name, logo: document.getElementById('f-logo').value, userId: currentUser.uid };
        if(selectedDocId) await db.collection("vault").doc(selectedDocId).update(d);
        else await db.collection("vault").add(d);
        closeAllModals();
    }

    async function saveItem() {
        const user = document.getElementById('i-user').value;
        const pass = document.getElementById('i-pass').value;
        if(!user || !pass || !activeFolder) return;
        const d = { type: 'item', title: document.getElementById('i-title').value, user, pass, parentId: activeFolder.id, userId: currentUser.uid };
        if(selectedDocId) await db.collection("vault").doc(selectedDocId).update(d);
        else await db.collection("vault").add(d);
        closeAllModals();
    }

    async function saveQr() {
        const name = document.getElementById('qr-name').value;
        const url = document.getElementById('qr-url').value;
        if(!name || !url) return;
        const d = { type: 'qr', name, qrUrl: url, userId: currentUser.uid };
        if(selectedDocId) await db.collection("vault").doc(selectedDocId).update(d);
        else await db.collection("vault").add(d);
        closeAllModals();
    }

    async function deleteFolder() {
        if(confirm("Permanently delete folder and all contents?")) {
            const batch = db.batch();
            allData.filter(i => i.parentId === selectedDocId).forEach(i => batch.delete(db.collection("vault").doc(i.id)));
            batch.delete(db.collection("vault").doc(selectedDocId));
            await batch.commit();
            closeAllModals();
        }
    }
    async function deleteItem() { if(confirm("Delete this account?")) { await db.collection("vault").doc(selectedDocId).delete(); closeAllModals(); } }
    async function deleteQr() { if(confirm("Delete this QR?")) { await db.collection("vault").doc(selectedDocId).delete(); closeAllModals(); } }

    // UTILS & ADVANCE TOOLS
    function generatePass() {
        const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
        let pass = "";
        for (let i = 0; i < 14; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
        document.getElementById('gen-output').innerText = pass;
    }

    function copyIt(ev, txt) {
        ev.stopPropagation(); if (!txt) return;
        const target = ev.currentTarget;
        target.classList.add('fa-check'); target.classList.remove('fa-copy');
        
        const showT = () => { const t = document.getElementById('toast'); t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; target.classList.remove('fa-check'); target.classList.add('fa-copy'); }, 1500); };
        
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(txt).then(showT).catch(() => fallbackC(txt, showT));
        } else { fallbackC(txt, showT); }
    }

    function fallbackC(t, cb) {
        const ta = document.createElement("textarea"); ta.value = t; ta.style.position="fixed"; ta.style.left="-9999px";
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { if (document.execCommand('copy')) cb(); } catch (e) {} document.body.removeChild(ta);
    }

    function setTheme(t) { document.body.className = t; localStorage.setItem('ridham_theme', t); }
    setTheme(localStorage.getItem('ridham_theme') || 'theme-purple');

    function toggleSidebar() { 
        const s = document.getElementById('sidebar'), o = document.querySelector('.sidebar-overlay');
        if(s.classList.contains('active')) { s.classList.remove('active'); o.style.display='none'; }
        else { s.classList.add('active'); o.style.display='block'; }
    }

    function openThemeModal() { toggleSidebar(); document.getElementById('theme-modal').style.display='flex'; }
    function handleAuth() {
        const e = document.getElementById('log-email').value, p = document.getElementById('log-pass').value;
        auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
    }
    function logout() { auth.signOut(); }

    function initMatrix() {
        const c = document.getElementById('matrix-canvas'), ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const l = "01", f = 10, cols = c.width / f, drops = Array(Math.floor(cols)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle = "#00ff41"; ctx.font = f + "px monospace";
            drops.forEach((y, i) => {
                ctx.fillText(l[Math.floor(Math.random()*l.length)], i*f, y*f);
                if(y*f > c.height && Math.random() > 0.975) drops[i] = 0; drops[i]++;
            });
        } setInterval(draw, 33);
    }
</script>
